x-app: &app
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=64m
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  labels:
    co.elastic.logs.enabled: "true"
    co.elastic.logs.integration: "standard"

x-app-environment: &app-environment
  MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4317
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ee.geckosolutions.mra.common.platform.observation.ecs.EcsStructuredLogFormatter

x-app-rabbitmq-client: &app-rabbitmq-client
  SPRING_RABBITMQ_HOST: rabbitmq.mra.local
  SPRING_RABBITMQ_SSL_ENABLED: "true"
  SPRING_RABBITMQ_SSL_BUNDLE: rabbit
  SPRING_SSL_BUNDLE_PEM_RABBIT_TRUSTSTORE_CERTIFICATE: file:/certs/internal-server_ca.crt

x-app-tls-server: &app-tls-server
  SERVER_SSL_BUNDLE: server
  SPRING_SSL_BUNDLE_PEM_SERVER_OPTIONS_ENABLEDPROTOCOLS: TLSv1.3
  SPRING_SSL_BUNDLE_PEM_SERVER_KEYSTORE_CERTIFICATE: file:/certs/internal-server.crt
  SPRING_SSL_BUNDLE_PEM_SERVER_KEYSTORE_PRIVATEKEY: file:/certs/internal-server.key

services:

  traefik:
    image: traefik:v3.7.17
    ports:
      - "8443:443"
    volumes:
      - ./config/traefik:/etc/traefik/dynamic:ro
      - ../../etc/certificate:/certs:ro
    command:
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--log.level=INFO"
      - "--log.format=json"
      - "--accesslog=true"
      - "--accesslog.format=json"
    labels:
      co.elastic.logs.enabled: "true"
      co.elastic.logs.integration: "traefik"
    networks:
      - edge

  traefik-experimental:
    image: traefik:v3.7.17
    ports:
      - "8443:443"
    volumes:
      - ./config/traefik-experimental:/etc/traefik/dynamic:ro
      - ../../etc/certificate:/certs:ro
    command:
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--log.level=DEBUG"
      - "--log.format=json"
      - "--accesslog=true"
      - "--accesslog.format=json"
    labels:
      co.elastic.logs.enabled: "true"
      co.elastic.logs.integration: "traefik"
    networks:
      - edge

  redis-experimental:
    image: redis:8.10-alpine
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cache

  keycloak-db:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - postgres-keycloak-data:/var/lib/postgresql
    networks:
      - identity-data

  keycloak:
    image: quay.io/keycloak/keycloak:26.8
    depends_on:
      - keycloak-db
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: mra
      KC_BOOTSTRAP_ADMIN_PASSWORD: mra123
      KC_HOSTNAME: https://kc.mra.local:8443
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - ./config/keycloak/mra-realm.json:/opt/keycloak/data/import/mra-realm.json:ro
    command:
      - start-dev
      - --import-realm
    networks:
      - edge
      - identity
      - identity-data

  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    ports:
      - "5671:5671"
      - "15672:15672"
    volumes:
      - ./config/internal-server_ca.crt:/certs/rabbitmq_ca.crt:ro
      - ./config/internal-server.crt:/certs/rabbitmq.crt:ro
      - ./config/internal-server.key:/certs/rabbitmq.key:ro
      - ./config/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./config/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      messaging:
        aliases:
          - rabbitmq.mra.local

  blackbox:
    image: prom/blackbox-exporter:v0.29.1-distroless
    ports:
      - "9115:9115"
    volumes:
      - ./config/prometheus/blackbox.yaml:/etc/blackbox_exporter/config.yml:ro
    networks:
      - observability

  prometheus:
    image: prom/prometheus:v3.16.0-distroless
    depends_on:
      - blackbox
    ports:
      - "9444:9090"
    volumes:
      - ./config/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml:ro
    networks:
      - observability

  tempo:
    image: grafana/tempo:3.1.1
    # TODO workaround root user
    user: root
    ports:
      - "3200:3200"
      - "4317:4317"
    volumes:
      - ./config/grafana/tempo.yaml:/etc/config.yaml:ro
      - tempo-data:/data/tempo
    command:
      - "-config.file=/etc/config.yaml"
    networks:
      - observability

  grafana:
    image: grafana/grafana:13.3.0-distroless-slim
    depends_on:
      - prometheus
      - tempo
    ports:
      - "9445:3000"
    environment:
      GF_SECURITY_ADMIN_USER: mra
      GF_SECURITY_ADMIN_PASSWORD: mra123
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks:
      - observability

  elasticsearch:
    image: elastic/elasticsearch:9.5.6
    environment:
      ES_SETTING_DISCOVERY_TYPE: single-node
      ES_SETTING_XPACK_SECURITY_ENABLED: true
      ES_PORT: 0.0.0.0:9200
      ES_JAVA_OPTS: -Xms2g -Xmx2g
      ELASTIC_PASSWORD: elastic_secret
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -u elastic:elastic_secret 'http://elasticsearch:9200/_cluster/health?wait_for_status=yellow'"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 4g
    networks:
      - observability

  elasticsearch-setup:
    image: curlimages/curl:8.23.0
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTIC_USERNAME: elastic
      ELASTIC_PASSWORD: elastic_secret
      KIBANA_USERNAME: kibana_system
      KIBANA_PASSWORD: kibana_system_secret
      MRA_USERNAME: mra
      MRA_PASSWORD: mra123
    volumes:
      - ./config/elastic/elasticsearch-setup.sh:/config/setup.sh:ro
      - ./config/elastic/elasticsearch-component-template.json:/config/component-template.json:ro
      - ./config/elastic/elasticsearch-index-template.json:/config/index-template.json:ro
    entrypoint: [ "/bin/sh", "/config/setup.sh" ]
    restart: "no"
    networks:
      - observability

  kibana:
    image: elastic/kibana:9.5.6
    depends_on:
      elasticsearch-setup:
        condition: service_completed_successfully
    ports:
      - "9446:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: kibana_system_secret
      XPACK_FLEET_ENABLED: true
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: 7F3A91C4E82D5B106AC9F731D8452E0B4D8C217FA69035BE1C7A92D4F08E6B53
      XPACK_REPORTING_ENCRYPTIONKEY: A81D4E729C063FB5E1428A97D6C30F51E7B2A4C89D10F6358F4E1C9A72B5D803
      XPACK_SECURITY_ENCRYPTIONKEY: 3C9F0A72E5B184D63A8F2C917D4E6B30D71E5A924C8F3B106AD6792E41F05C87
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://kibana:5601/api/status"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - observability

  kibana-setup:
    image: curlimages/curl:8.23.0
    depends_on:
      kibana:
        condition: service_healthy
    environment:
      KIBANA_USERNAME: elastic
      KIBANA_PASSWORD: elastic_secret
    volumes:
      - ./config/elastic/kibana-setup.sh:/config/setup.sh:ro
      - ./config/elastic/kibana-saved-objects.ndjson:/config/saved-objects.ndjson:ro
    entrypoint: [ "/bin/sh", "/config/setup.sh" ]
    restart: "no"
    networks:
      - observability

  elastic-fleet-setup:
    image: curlimages/curl:8.23.0
    depends_on:
      kibana-setup:
        condition: service_completed_successfully
    user: root
    environment:
      KIBANA_USERNAME: elastic
      KIBANA_PASSWORD: elastic_secret
      FLEET_SERVER_SERVICE_TOKEN_PATH: /config/secrets/fleet-server.token
      MRA_AGENT_ENROLLMENT_TOKEN_PATH: /config/secrets/mra-agent-enrollment.token
    volumes:
      - ./config/elastic/fleet-setup.sh:/config/setup.sh:ro
      - secrets:/config/secrets
    entrypoint: [ "/bin/sh", "/config/setup.sh" ]
    restart: "no"
    networks:
      - observability

  elastic-fleet:
    image: elastic/elastic-agent:9.5.6
    depends_on:
      elastic-fleet-setup:
        condition: service_completed_successfully
    ports:
      - "8220:8220"
    environment:
      FLEET_SERVER_ENABLE: 1
      FLEET_SERVER_POLICY_ID: fleet-server-policy
      FLEET_SERVER_ELASTICSEARCH_HOST: http://elasticsearch:9200
      FLEET_SERVER_SERVICE_TOKEN_PATH: /config/secrets/fleet-server.token
      FLEET_SERVER_HOST: 0.0.0.0
      FLEET_SERVER_PORT: 8220
      FLEET_SERVER_CERT: "/certs/mra.crt"
      FLEET_SERVER_CERT_KEY: "/certs/mra.key"
      FLEET_CA: "/certs/root_ca.crt"
      FLEET_URL: https://fleet.mra.local:8220
    volumes:
      - ../../etc/certificate:/certs:ro
      - secrets:/config/secrets:ro
    networks:
      observability:
        aliases:
          - fleet.mra.local

  elastic-agent:
    image: elastic/elastic-agent:9.5.6
    depends_on:
      elastic-fleet:
        condition: service_started
    environment:
      FLEET_ENROLL: 1
      FLEET_URL: https://fleet.mra.local:8220
      FLEET_CA: "/certs/root_ca.crt"
    volumes:
      - ../../target/logs:/logs:ro
      - ../../etc/certificate:/certs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - secrets:/config/secrets:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        export FLEET_ENROLLMENT_TOKEN="$$(cat /config/secrets/mra-agent-enrollment.token)"
        exec /usr/bin/tini -- /usr/local/bin/docker-entrypoint
    networks:
      - observability

  mra-db:
    image: postgres:18.6-alpine
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: mra
      POSTGRES_PASSWORD: mra123
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -h localhost -U mra" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - ./config/postgres/init-core.sql:/docker-entrypoint-initdb.d/init-core.sql:ro
      - postgres-mra-data:/var/lib/postgresql
    networks:
      - mra-data

  gateway:
    <<: *app
    image: ${MRA_IMAGE_REGISTRY:-}mra/gateway:${MRA_IMAGE_TAG:-latest}
    environment:
      <<: *app-environment
      MANAGEMENT_SERVER_PORT: 8081
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://keycloak:8080/realms/mra/protocol/openid-connect/certs
      SPRING_SSL_BUNDLE_PEM_CLIENT_TRUSTSTORE_CERTIFICATE: file:/certs/internal-server_ca.crt
      APPLICATION_SECURITY_CORS_ALLOWEDORIGINS: https://ui.mra.local:8443
      APPLICATION_INTERNALSERVICES_CORESERVICE_BASEURL: https://core.mra.local
      APPLICATION_INTERNALSERVICES_CORESERVICE_BUNDLE: client
      APPLICATION_INTERNALSERVICES_CORESERVICE_USERNAME: gateway
      APPLICATION_INTERNALSERVICES_CORESERVICE_PASSWORD: gateway-secret
    volumes:
      - ./config/internal-server_ca.crt:/certs/internal-server_ca.crt:ro
    mem_limit: 512m
    networks:
      edge:
        aliases:
          - gateway.mra.local
      identity:
      mra-api:
      observability:
        aliases:
          - gateway.mra.local

  core:
    <<: *app
    image: ${MRA_IMAGE_REGISTRY:-}mra/core:${MRA_IMAGE_TAG:-latest}
    depends_on:
      mra-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      <<: [ *app-environment, *app-rabbitmq-client, *app-tls-server ]
      SERVER_PORT: 443
      MANAGEMENT_SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://mra-db:5432/core
      SPRING_LIQUIBASE_CONTEXTS: demo
      APPLICATION_KEYCLOAK_BASEURL: http://keycloak:8080
      APPLICATION_SECURITY_SERVERCREDENTIALS_0_USERNAME: gateway
      APPLICATION_SECURITY_SERVERCREDENTIALS_0_PASSWORD: Hguq5QpuIAbYlPnmTFOhMX5gMvS6Z98IGZ1TeMWUjOY=
    volumes:
      - ./config/internal-server_ca.crt:/certs/internal-server_ca.crt:ro
      - ./config/internal-server.crt:/certs/internal-server.crt:ro
      - ./config/internal-server.key:/certs/internal-server.key:ro
    mem_limit: 512m
    networks:
      mra-api:
        aliases:
          - core.mra.local
      identity:
      messaging:
      mra-data:
      observability:
        aliases:
          - core.mra.local

  worker:
    <<: *app
    image: ${MRA_IMAGE_REGISTRY:-}mra/worker:${MRA_IMAGE_TAG:-latest}
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      <<: [ *app-environment, *app-rabbitmq-client, *app-tls-server ]
      SERVER_PORT: 443
      MANAGEMENT_SERVER_PORT: 8081
    volumes:
      - ./config/internal-server_ca.crt:/certs/internal-server_ca.crt:ro
      - ./config/internal-server.crt:/certs/internal-server.crt:ro
      - ./config/internal-server.key:/certs/internal-server.key:ro
    mem_limit: 512m
    networks:
      messaging:
      observability:
        aliases:
          - worker.mra.local

  token-experimental:
    <<: *app
    image: ${MRA_IMAGE_REGISTRY:-}mra/token:${MRA_IMAGE_TAG:-latest}
    depends_on:
      redis-experimental:
        condition: service_healthy
    environment:
      <<: *app-environment
      MANAGEMENT_SERVER_PORT: 8081
      SPRING_DATA_REDIS_HOST: redis-experimental
      APPLICATION_KEYCLOAK_BASEURL: http://keycloak:8080
      APPLICATION_SECURITY_CORS_ALLOWEDORIGINS: https://ui.mra.local:8443
    mem_limit: 512m
    networks:
      edge:
        aliases:
          - token-experimental.mra.local
      identity:
      cache:
      observability:
        aliases:
          - token-experimental.mra.local

  ui:
    image: ${MRA_IMAGE_REGISTRY:-}mra/ui:${MRA_IMAGE_TAG:-latest}
    labels:
      co.elastic.logs.enabled: "true"
      co.elastic.logs.integration: "nginx"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    networks:
      edge:
        aliases:
          - ui.mra.local

  likec4:
    image: likec4/likec4:1.60
    ports:
      - "5173:5173"
      - "24700:24700"
    environment:
      CHOKIDAR_USEPOLLING: 1
      CHOKIDAR_INTERVAL: 200
      HMR_PORT: 24700
    volumes:
      - ../c4:/data
    command: start

volumes:
  secrets:
  elasticsearch-data:
  postgres-keycloak-data:
  postgres-mra-data:
  rabbitmq-data:
  tempo-data:
  grafana-data:
  redis-data:
networks:
  edge:
  identity:
    internal: true
  mra-api:
    internal: true
  messaging:
  mra-data:
  identity-data:
    internal: true
  cache:
  observability:
