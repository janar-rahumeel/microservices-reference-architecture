services:

  traefik:
    image: traefik:v3.7.13
    ports:
      - "8443:443"
    volumes:
      - ./config/traefik:/etc/traefik/dynamic:ro
      - ../../etc/certificate:/certs:ro
    command:
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--log.level=INFO"
      - "--log.format=json"
      - "--accesslog=true"
      - "--accesslog.format=json"

  traefik-experimental:
    image: traefik:v3.7.13
    ports:
      - "8443:443"
    volumes:
      - ./config/traefik-experimental:/etc/traefik/dynamic:ro
      - ../../etc/certificate:/certs:ro
    command:
      - "--entrypoints.websecure.address=:443"
      - "--entrypoints.websecure.http.tls=true"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--log.level=DEBUG"
      - "--log.format=json"
      - "--accesslog=true"
      - "--accesslog.format=json"

  redis-experimental:
    image: redis:8.10.1-alpine
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    command: redis-server --appendonly yes

  keycloak-db:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - postgres-keycloak-data:/var/lib/postgresql

  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    depends_on:
      - keycloak-db
    ports:
      - "127.0.0.1:8100:8080"
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: mra
      KC_BOOTSTRAP_ADMIN_PASSWORD: mra123
      KC_HOSTNAME: https://kc.mra.local:8443
      KC_PROXY_HEADERS: xforwarded
    command:
      - start-dev

  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./config/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./config/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - rabbitmq-data:/var/lib/rabbitmq

  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    ports:
      - "9115:9115"
    volumes:
      - ./config/prometheus/blackbox.yaml:/etc/blackbox_exporter/config.yml:ro

  prometheus:
    image: prom/prometheus:v3.13.0
    depends_on:
      - blackbox
    ports:
      - "9444:9090"
    volumes:
      - ./config/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml:ro

  tempo:
    image: grafana/tempo:2.9.5
    ports:
      - "3200:3200"
      - "4317:4317"
    volumes:
      - ./config/grafana/tempo.yaml:/etc/config.yaml:ro
      - tempo-data:/tmp/tempo
    command:
      - "-config.file=/etc/config.yaml"

  grafana:
    image: grafana/grafana:13.1.4
    depends_on:
      - prometheus
      - tempo
    ports:
      - "9445:3000"
    environment:
      GF_SECURITY_ADMIN_USER: mra
      GF_SECURITY_ADMIN_PASSWORD: mra123
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana

  elasticsearch:
    image: elastic/elasticsearch:9.5.0
    environment:
      ES_SETTING_DISCOVERY_TYPE: single-node
      ES_SETTING_XPACK_SECURITY_ENABLED: true
      ES_PORT: 0.0.0.0:9200
      ES_JAVA_OPTS: -Xms2g -Xmx2g
      ELASTIC_PASSWORD: elastic_secret
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS -u elastic:elastic_secret 'http://elasticsearch:9200/_cluster/health?wait_for_status=yellow'"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: 4g
    networks:
      - infra

  elasticsearch-setup:
    image: curlimages/curl:8.10.1
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTIC_USERNAME: elastic
      ELASTIC_PASSWORD: elastic_secret
      KIBANA_USERNAME: kibana_system
      KIBANA_PASSWORD: kibana_system_secret
      MRA_USERNAME: mra
      MRA_PASSWORD: mra123
    volumes:
      - ./config/elastic/elasticsearch-setup.sh:/config/setup.sh:ro
      - ./config/elastic/elasticsearch-component-template.json:/config/component-template.json:ro
      - ./config/elastic/elasticsearch-index-template.json:/config/index-template.json:ro
    entrypoint: [ "/bin/sh", "/config/setup.sh" ]
    restart: "no"
    networks:
      - infra

  kibana:
    image: elastic/kibana:9.5.0
    depends_on:
      elasticsearch-setup:
        condition: service_completed_successfully
    ports:
      - "9446:5601"
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: kibana_system_secret
      XPACK_FLEET_ENABLED: true
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: 7F3A91C4E82D5B106AC9F731D8452E0B4D8C217FA69035BE1C7A92D4F08E6B53
      XPACK_REPORTING_ENCRYPTIONKEY: A81D4E729C063FB5E1428A97D6C30F51E7B2A4C89D10F6358F4E1C9A72B5D803
      XPACK_SECURITY_ENCRYPTIONKEY: 3C9F0A72E5B184D63A8F2C917D4E6B30D71E5A924C8F3B106AD6792E41F05C87
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://kibana:5601/api/status"
        ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - infra

  kibana-setup:
    image: curlimages/curl:8.10.1
    depends_on:
      kibana:
        condition: service_healthy
    environment:
      KIBANA_USERNAME: elastic
      KIBANA_PASSWORD: elastic_secret
    volumes:
      - ./config/elastic/kibana-setup.sh:/config/setup.sh:ro
      - ./config/elastic/kibana-saved-objects.ndjson:/config/saved-objects.ndjson:ro
    entrypoint: [ "/bin/sh", "/config/setup.sh" ]
    restart: "no"
    networks:
      - infra

  elastic-fleet-setup:
    image: curlimages/curl:8.10.1
    depends_on:
      kibana-setup:
        condition: service_completed_successfully
    user: root
    environment:
      KIBANA_USERNAME: elastic
      KIBANA_PASSWORD: elastic_secret
      FLEET_SERVER_SERVICE_TOKEN_PATH: /config/secrets/fleet-server.token
      MRA_AGENT_ENROLLMENT_TOKEN_PATH: /config/secrets/mra-agent-enrollment.token
    volumes:
      - ./config/elastic/fleet-setup.sh:/config/setup.sh:ro
      - secrets:/config/secrets
    entrypoint: [ "/bin/sh", "/config/setup.sh" ]
    restart: "no"
    networks:
      - infra

  elastic-fleet:
    image: elastic/elastic-agent:9.5.0
    depends_on:
      elastic-fleet-setup:
        condition: service_completed_successfully
    ports:
      - "8220:8220"
    environment:
      FLEET_SERVER_ENABLE: 1
      FLEET_SERVER_POLICY_ID: fleet-server-policy
      FLEET_SERVER_ELASTICSEARCH_HOST: http://elasticsearch:9200
      FLEET_SERVER_SERVICE_TOKEN_PATH: /config/secrets/fleet-server.token
      FLEET_SERVER_HOST: 0.0.0.0
      FLEET_SERVER_PORT: 8220
      FLEET_SERVER_CERT: "/certs/mra.crt"
      FLEET_SERVER_CERT_KEY: "/certs/mra.key"
      FLEET_CA: "/certs/root_ca.crt"
      FLEET_URL: https://fleet.mra.local:8220
    volumes:
      - ../../etc/certificate:/certs:ro
      - secrets:/config/secrets:ro
    networks:
      infra:
        aliases:
          - fleet.mra.local

  elastic-agent:
    image: elastic/elastic-agent:9.5.0
    depends_on:
      elastic-fleet:
        condition: service_started
    environment:
      FLEET_ENROLL: 1
      FLEET_URL: https://fleet.mra.local:8220
      FLEET_CA: "/certs/root_ca.crt"
    volumes:
      - ../../target/logs:/logs:ro
      - ../../etc/certificate:/certs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - secrets:/config/secrets:ro
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        export FLEET_ENROLLMENT_TOKEN="$$(cat /config/secrets/mra-agent-enrollment.token)"
        exec /usr/bin/tini -- /usr/local/bin/docker-entrypoint
    networks:
      - infra

  likec4:
    image: likec4/likec4:1.59
    ports:
      - "5173:5173"
      - "24700:24700"
    environment:
      CHOKIDAR_USEPOLLING: 1
      CHOKIDAR_INTERVAL: 200
      HMR_PORT: 24700
    volumes:
      - ../c4:/data
    command: start

volumes:
  secrets:
  elasticsearch-data:
  postgres-keycloak-data:
  rabbitmq-data:
  tempo-data:
  grafana-data:
networks:
  infra:
