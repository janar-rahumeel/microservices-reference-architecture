services:

  keycloak-db:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - ./data/postgresql/keycloak:/var/lib/postgresql

  keycloak:
    image: quay.io/keycloak/keycloak:26.6
    depends_on:
      - keycloak-db
    ports:
      - "9443:8443"
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: keycloak-db
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/certs/tls.key
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/certs/tls.crt
      KC_HOSTNAME: kc.mra.local
    volumes:
      - ../../etc/certificate/mra.crt:/opt/keycloak/certs/tls.crt
      - ../../etc/certificate/mra.key:/opt/keycloak/certs/tls.key
      - ./data/keycloak:/opt/keycloak/data
    command:
      - start

  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - ./config/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./config/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./data/rabbitmq:/var/lib/rabbitmq

  blackbox:
    image: prom/blackbox-exporter:v0.27.0
    ports:
      - "9115:9115"
    volumes:
      - ./config/prometheus/blackbox.yaml:/etc/blackbox_exporter/config.yml:ro

  prometheus:
    image: prom/prometheus:v3.13.0
    ports:
      - "9444:9090"
    depends_on:
      - blackbox
    volumes:
      - ./config/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml:ro

  tempo:
    image: grafana/tempo:latest
    ports:
      - "3200:3200"
      - "4317:4317"
    volumes:
      - ./config/tempo/tempo.yaml:/etc/config.yaml:ro
      - ./data/tempo:/tmp/tempo

  grafana:
    image: grafana/grafana:13.1
    ports:
      - "9445:3000"
    depends_on:
      - prometheus
      - tempo
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./data/grafana:/var/lib/grafana