global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [ http_2xx ]
    static_configs:
      - targets:
          - http://token-experimental.mra.local:8081/internal/actuator/health
        labels:
          service_name: token
      - targets:
          - http://gateway.mra.local:8081/internal/actuator/health
        labels:
          service_name: gateway
      - targets:
          - http://core.mra.local:8081/internal/actuator/health
        labels:
          service_name: core
      - targets:
          - http://worker.mra.local:8081/internal/actuator/health
        labels:
          service_name: worker
    relabel_configs:
      - source_labels: [ __address__ ]
        target_label: __param_target
      - source_labels: [ __param_target ]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
  - job_name: "token-experimental"
    metrics_path: "/internal/actuator/prometheus"
    static_configs:
      - targets:
          - "token-experimental.mra.local:8081"
  - job_name: "gateway"
    metrics_path: "/internal/actuator/prometheus"
    static_configs:
      - targets:
          - "gateway.mra.local:8081"
  - job_name: "core"
    metrics_path: "/internal/actuator/prometheus"
    static_configs:
      - targets:
          - "core.mra.local:8081"
  - job_name: "worker"
    metrics_path: "/internal/actuator/prometheus"
    static_configs:
      - targets:
          - "worker.mra.local:8081"