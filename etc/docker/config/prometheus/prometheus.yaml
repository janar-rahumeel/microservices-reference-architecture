global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: blackbox
    metrics_path: /probe
    params:
      module: [ http_2xx ]
    static_configs:
      - targets:
          - http://host.docker.internal:8243/internal/actuator/health
        labels:
          application: gateway
      - targets:
          - http://host.docker.internal:8244/internal/actuator/health
        labels:
          application: core
      - targets:
          - http://host.docker.internal:8245/internal/actuator/health
        labels:
          application: worker
    relabel_configs:
      - source_labels: [ __address__ ]
        target_label: __param_target
      - source_labels: [ __param_target ]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
  - job_name: "gateway"
    metrics_path: "/internal/actuator/prometheus"
    static_configs:
      - targets:
          - "host.docker.internal:8243"
  - job_name: "core"
    metrics_path: "/internal/actuator/prometheus"
    static_configs:
      - targets:
          - "host.docker.internal:8244"
  - job_name: "worker"
    metrics_path: "/internal/actuator/prometheus"
    static_configs:
      - targets:
          - "host.docker.internal:8245"