spring.rabbitmq.host=localhost
spring.rabbitmq.ssl.enabled=true
spring.rabbitmq.ssl.bundle=rabbit
spring.ssl.bundle.pem.rabbit.truststore.certificate=file:../etc/docker/config/internal-server_ca.crt
spring.ssl.bundle.pem.server.keystore.certificate=file:../etc/docker/config/internal-server.crt
spring.ssl.bundle.pem.server.keystore.private-key=file:../etc/docker/config/internal-server.key

management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4317
management.server.port=9003

logging.structured.format.file=ee.geckosolutions.mra.common.platform.observation.ecs.EcsStructuredLogFormatter
logging.file.name=../target/logs/${spring.application.name}.log

server.port=8003
server.ssl.bundle=server
server.ssl.enabled-protocols=TLSv1.3