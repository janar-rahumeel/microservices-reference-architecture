spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://kc.mra.local:8443/realms/mra/protocol/openid-connect/certs
spring.ssl.bundle.pem.root-ca.truststore.certificate=file:../etc/certificate/root_ca.crt

management.server.port=9001
management.opentelemetry.tracing.export.otlp.enabled=false

application.security.cors.allowed-origins=http://localhost:4200
application.internal-services.core-service.base-url=http://localhost:8002
application.internal-services.core-service.username=gateway
application.internal-services.core-service.password=gateway-secret

logging.structured.format.file=ee.geckosolutions.mra.common.platform.observation.ecs.EcsStructuredLogFormatter
logging.file.name=../target/logs/${spring.application.name}.log

server.port=8001