spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8100/realms/mra/protocol/openid-connect/certs
spring.ssl.bundle.pem.client.truststore.certificate=file:../etc/docker/config/internal-server_ca.crt

management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4317
management.server.port=9001

application.security.cors.allowed-origins=https://ui.mra.local:8443
application.internal-services.core-service.base-url=https://localhost:8002
application.internal-services.core-service.bundle=client
application.internal-services.core-service.username=gateway
application.internal-services.core-service.password=gateway-secret

logging.structured.format.file=ee.geckosolutions.mra.common.platform.observation.ecs.EcsStructuredLogFormatter
logging.file.name=../target/logs/${spring.application.name}.log

server.port=8001