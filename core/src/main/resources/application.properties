spring.application.name=core
spring.datasource.url=jdbc:h2:mem:coredb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.rabbitmq.port=5672
spring.rabbitmq.username=mra
spring.rabbitmq.password=mra-secret
spring.rabbitmq.virtual-host=/

management.endpoint.health.group.critical.include=db,rabbit

logging.level.org.zalando.logbook=TRACE