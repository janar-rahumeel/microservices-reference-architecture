spring.application.name=core
spring.liquibase.liquibase-schema=liquibase
spring.liquibase.user=core_liquibase
spring.liquibase.password=core_liquibase-secret
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=core
spring.datasource.password=core-secret
spring.rabbitmq.port=5672
spring.rabbitmq.username=mra
spring.rabbitmq.password=mra-secret
spring.rabbitmq.virtual-host=/

management.endpoint.health.group.critical.include=db,rabbit

logging.level.org.zalando.logbook=TRACE

application.keycloak.required-actions[0]=UPDATE_PASSWORD
application.keycloak.service-account.client-id=mra-user-provisioning
application.keycloak.service-account.client-secret=mra-user-provisioning-secret